name: Auto Optimize & Backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols (empty = all 52)'
        required: false
        default: ''

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto optimization
        run: |
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            python auto_optimize.py --symbols "${{ github.event.inputs.symbols }}"
          else
            python auto_optimize.py
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: optimization-results
          path: data/optimization_results.json
