name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to backtest'
        default: '365'
      symbols:
        description: 'Symbols (comma-separated, empty=all)'
        default: ''
      max_hold:
        description: 'Max holding days'
        default: '10'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: |
          python backtest_multi.py \
            --days ${{ github.event.inputs.days }} \
            --max-hold ${{ github.event.inputs.max_hold }} \
            ${{ github.event.inputs.symbols && format('--symbols {0}', github.event.inputs.symbols) || '' }}
