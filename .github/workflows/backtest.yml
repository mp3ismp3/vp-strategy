name: Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        default: 'backtest'
        type: choice
        options:
          - backtest
          - optimize
          - backtest_1h
          - optimize_1h
          - analyze_filters
          - analyze_exits
      days:
        description: 'Days to backtest'
        default: '365'
      symbols:
        description: 'Symbols (comma-separated, empty=all/top10)'
        default: ''
      max_hold:
        description: 'Max holding days'
        default: '10'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run backtest
        if: ${{ github.event.inputs.mode == 'backtest' }}
        run: |
          python backtest.py \
            --days ${{ github.event.inputs.days }} \
            --max-hold ${{ github.event.inputs.max_hold }} \
            ${{ github.event.inputs.symbols && format('--symbols {0}', github.event.inputs.symbols) || '' }}

      - name: Run optimization
        if: ${{ github.event.inputs.mode == 'optimize' }}
        run: |
          python optimize.py \
            ${{ github.event.inputs.symbols && format('--symbols {0}', github.event.inputs.symbols) || '' }}

      - name: Run 1H backtest
        if: ${{ github.event.inputs.mode == 'backtest_1h' }}
        run: |
          python backtest_1h.py \
            ${{ github.event.inputs.symbols && format('--symbols {0}', github.event.inputs.symbols) || '' }}

      - name: Run 1H optimization
        if: ${{ github.event.inputs.mode == 'optimize_1h' }}
        run: |
          python optimize_1h.py \
            ${{ github.event.inputs.symbols && format('--symbols {0}', github.event.inputs.symbols) || '' }}

      - name: Run filter analysis
        if: ${{ github.event.inputs.mode == 'analyze_filters' }}
        run: |
          python analyze_filters.py \
            --days ${{ github.event.inputs.days }} \
            ${{ github.event.inputs.symbols && format('--symbols {0}', github.event.inputs.symbols) || '' }}

      - name: Run exit analysis
        if: ${{ github.event.inputs.mode == 'analyze_exits' }}
        run: |
          python analyze_exits.py \
            --days ${{ github.event.inputs.days }} \
            ${{ github.event.inputs.symbols && format('--symbols {0}', github.event.inputs.symbols) || '' }}
