name: Send Signal Guide

on:
  workflow_dispatch:

jobs:
  send-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send guide to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from notifications.telegram import send_telegram; from notifications.guide import format_signal_guide; send_telegram(format_signal_guide(), parse_mode=None)"
