name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'strategies/**'
      - 'scoring/**'
      - 'tests/**'
      - 'scanner.py'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas yfinance requests pytest

      - name: Run tests
        run: pytest tests/ -v
